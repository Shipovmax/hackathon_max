# DATA-API 1.0 — обязательные проверки API мини-приложения владельца.
# Паролей, токенов и ключей здесь нет. Роль "owner" — тестовый владелец: запросы от него
# идут с заголовком "Authorization: Bearer <REVIEW_API_TOKEN>", токен передаётся организаторам
# отдельно. У тестового владельца своя сеть с демо-точками, чужие данные ему не видны.
#
# Сценарий: владелец видит сводку по точкам, открывает точку и её день, добавляет сотрудника
# (получает код для бота) и задачу, правит задачу, смотрит график и проверяет его на
# незакрытые часы. Всё созданное удаляется в cleanup.

schemaVersion: "1.0"

solution:
  name: "Контроль смен для сети магазинов (MAX)"
  teamId: "t185"

api:
  baseUrl: "https://task-controller.ru/api"
  openapi: "./openapi.yaml"
  defaultHeaders:
    Accept: "application/json"

checks:
  - id: "health"
    name: "API доступен"
    method: "GET"
    path: "/health/"
    role: "public"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["status"]
    timeoutMs: 5000
    repeatable: true

  - id: "no-auth-rejected"
    name: "Без входа данные владельца не отдаются"
    method: "GET"
    path: "/me/"
    role: "public"
    expected:
      statusCodes: [401]
      contentType: "application/json"
      requiredFields: ["detail"]
    timeoutMs: 5000
    repeatable: true

  - id: "me"
    name: "Владелец и его сеть"
    method: "GET"
    path: "/me/"
    role: "owner"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["max_user_id", "role", "network"]
    timeoutMs: 5000
    repeatable: true

  - id: "list-stores"
    name: "Точки сети с сотрудниками"
    method: "GET"
    path: "/stores/"
    role: "owner"
    dependsOn: ["me"]
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
        items:
          type: "object"
          required: ["id", "name", "open_time", "close_time", "closed_weekdays", "employees"]
    timeoutMs: 5000
    repeatable: true
    extract:
      storeId: "$[0].id"

  - id: "dashboard"
    name: "Сводка по точкам за сегодня"
    method: "GET"
    path: "/dashboard/"
    role: "owner"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["date", "stores"]
      bodySchema:
        type: "object"
        required: ["date", "stores"]
        properties:
          stores:
            type: "array"
            items:
              type: "object"
              required: ["id", "name", "done", "total", "health"]
              properties:
                health:
                  enum: ["unclaimed", "overdue", "late", "ok"]
    timeoutMs: 5000
    repeatable: true

  - id: "store-day"
    name: "Карточка дня точки: задачи, отметки, кто на смене"
    method: "GET"
    path: "/stores/{storeId}/day/"
    role: "owner"
    dependsOn: ["list-stores"]
    request:
      path:
        storeId: "${storeId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["store", "date", "closed", "on_shift", "tasks"]
    timeoutMs: 5000
    repeatable: true

  - id: "create-employee"
    name: "Добавить сотрудника и получить код для бота"
    method: "POST"
    path: "/stores/{storeId}/employees/"
    role: "owner"
    dependsOn: ["list-stores"]
    request:
      path:
        storeId: "${storeId}"
      headers:
        Content-Type: "application/json"
      body:
        name: "Проверка API"
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "name", "status", "invite_code"]
      bodySchema:
        type: "object"
        required: ["id", "status", "invite_code"]
        properties:
          id:
            type: "integer"
          status:
            const: "invited"
          invite_code:
            type: "string"
    timeoutMs: 5000
    repeatable: false
    extract:
      employeeId: "$.id"

  - id: "create-task"
    name: "Добавить ежедневную задачу точки"
    method: "POST"
    path: "/stores/{storeId}/task-templates/"
    role: "owner"
    dependsOn: ["list-stores"]
    request:
      path:
        storeId: "${storeId}"
      headers:
        Content-Type: "application/json"
      body:
        title: "Проверка API"
        kind: "daily"
        planned_time: "23:30"
        tolerance_minutes: 15
        requires_photo: false
        requires_claim: false
    expected:
      statusCodes: [201]
      contentType: "application/json"
      requiredFields: ["id", "title", "planned_time", "available_from", "tolerance_minutes"]
      bodySchema:
        type: "object"
        required: ["id", "available_from"]
        properties:
          available_from:
            const: "23:00"
    timeoutMs: 5000
    repeatable: false
    extract:
      templateId: "$.id"

  - id: "update-task"
    name: "Изменить задачу: допуск и фото"
    method: "PATCH"
    path: "/task-templates/{templateId}/"
    role: "owner"
    dependsOn: ["create-task"]
    request:
      path:
        templateId: "${templateId}"
      headers:
        Content-Type: "application/json"
      body:
        tolerance_minutes: 30
        requires_photo: true
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["id", "tolerance_minutes", "requires_photo"]
      bodySchema:
        type: "object"
        properties:
          tolerance_minutes:
            const: 30
          requires_photo:
            const: true
    timeoutMs: 5000
    repeatable: true

  - id: "invalid-task-rejected"
    name: "Неверная задача отклоняется понятной ошибкой"
    method: "POST"
    path: "/stores/{storeId}/task-templates/"
    role: "owner"
    dependsOn: ["list-stores"]
    request:
      path:
        storeId: "${storeId}"
      headers:
        Content-Type: "application/json"
      body:
        title: "Разовая без даты"
        kind: "one_time"
        planned_time: "12:00"
    expected:
      statusCodes: [400]
      contentType: "application/json"
      requiredFields: ["detail"]
    timeoutMs: 5000
    repeatable: true

  - id: "list-tasks"
    name: "Задачи точки"
    method: "GET"
    path: "/stores/{storeId}/task-templates/"
    role: "owner"
    dependsOn: ["create-task"]
    request:
      path:
        storeId: "${storeId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      bodySchema:
        type: "array"
        minItems: 1
        items:
          type: "object"
          required: ["id", "title", "kind", "planned_time", "tolerance_minutes"]
    timeoutMs: 5000
    repeatable: true

  - id: "schedule"
    name: "График смен на текущую неделю"
    method: "GET"
    path: "/stores/{storeId}/schedule/"
    role: "owner"
    dependsOn: ["list-stores"]
    request:
      path:
        storeId: "${storeId}"
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["week_start", "status", "employees", "shifts", "gaps"]
    timeoutMs: 5000
    repeatable: true
    extract:
      weekStart: "$.week_start"

  - id: "coverage"
    name: "Проверка черновика графика на незакрытые часы"
    description: "Пустой черновик: вся неделя, кроме выходных точки, возвращается как окна без людей. Ничего не сохраняется."
    method: "POST"
    path: "/stores/{storeId}/schedule/coverage/"
    role: "owner"
    dependsOn: ["schedule"]
    request:
      path:
        storeId: "${storeId}"
      headers:
        Content-Type: "application/json"
      body:
        week_start: "${weekStart}"
        shifts: []
    expected:
      statusCodes: [200]
      contentType: "application/json"
      requiredFields: ["gaps"]
      bodySchema:
        type: "object"
        required: ["gaps"]
        properties:
          gaps:
            type: "array"
            minItems: 1
            items:
              type: "object"
              required: ["date", "start", "end"]
    timeoutMs: 5000
    repeatable: true

cleanup:
  - id: "delete-task"
    method: "DELETE"
    path: "/task-templates/{templateId}/"
    role: "owner"
    request:
      path:
        templateId: "${templateId}"
    expected:
      statusCodes: [204, 404]
    timeoutMs: 5000

  - id: "dismiss-employee"
    method: "POST"
    path: "/employees/{employeeId}/dismiss/"
    role: "owner"
    request:
      path:
        employeeId: "${employeeId}"
    expected:
      statusCodes: [200, 404]
    timeoutMs: 5000

  - id: "delete-employee"
    method: "DELETE"
    path: "/employees/{employeeId}/"
    role: "owner"
    request:
      path:
        employeeId: "${employeeId}"
    expected:
      statusCodes: [204, 404]
    timeoutMs: 5000
